name: Native C++17 rules probe
on:
  push:
    paths:
      - 'native-probe/**'
      - '.github/workflows/native-probe.yml'
  pull_request:
    paths:
      - 'native-probe/**'
      - '.github/workflows/native-probe.yml'
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native-probe -B native-probe/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native-probe/build --parallel 2
      - name: Test
        run: ctest --test-dir native-probe/build --output-on-failure
