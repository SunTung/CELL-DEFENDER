name: CELL DEFENDER Android debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'game/**'
      - 'scripts/**'
      - '.github/workflows/android-debug-apk.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required sources
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f game/web/index.html
          test -f scripts/verify_android_project.py
          test -f scripts/verify_android_assets.py
      - name: Generate missing image and audio resources
        run: |
          python3 scripts/generate_fallback_assets.py
          python3 scripts/validate_generated_resources.py
      - name: Run JavaScript tests
        run: |
          set -e
          for test in game/tests/*.test.js; do node "$test"; done
      - name: Validate Android bundle
        run: |
          python3 scripts/verify_android_project.py
          python3 scripts/verify_android_assets.py
          # Original Stage 15 SHA-256 gate is intentionally not used for generated fallback art.
          # The two generated asset trees must match byte-for-byte.
  apk:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Generate missing image and audio resources
        run: |
          python3 scripts/generate_fallback_assets.py
          python3 scripts/validate_generated_resources.py
      - name: Compile debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../gradle-build.log
      - name: Verify and hash APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-defender-debug-apk
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/apk.sha256
            gradle-build.log
