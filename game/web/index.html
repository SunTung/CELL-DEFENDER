<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08142b"><title>CELL DEFENDER 細胞防衛戰</title><link rel="icon" href="assets/images/apk_icon.png"><style>
*{box-sizing:border-box}body{margin:0;background:#030914;color:#d9f7ff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh}#app{position:relative;width:min(100vw,56.25dvh);aspect-ratio:9/16;overflow:hidden;border:2px solid #1576b7;background:radial-gradient(ellipse at center,#173a5d,#040a1c 75%);touch-action:none}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#020718aa,#020718e8);padding:18px;text-align:center}.overlay img{width:100%;object-fit:contain;max-height:38%;border-radius:12px}.overlay h1{font-size:clamp(20px,5vw,32px);margin:0;color:#8feeff;text-shadow:0 0 15px #12bfff}.overlay button,#hud button{border:1px solid #50dfff;border-radius:8px;background:#06395a;color:#f3ffff;padding:12px 22px;font-size:17px;cursor:pointer}.hidden{display:none!important}#hud{position:absolute;inset:0;pointer-events:none}#stats{position:absolute;top:8px;left:8px;right:8px;background:#031326b8;padding:8px;border-radius:6px;font-size:13px}#hud button{pointer-events:auto;position:absolute;bottom:12px;padding:8px 12px;font-size:13px}#heal{left:10px}#pause{right:10px}#hud #sound{right:8px;top:56px;bottom:auto}#hud #skills button{position:static;flex:1;min-width:0;padding:9px 2px;font-size:12px}#hud #skills{z-index:2}#hud #pause,#hud #heal{z-index:2}#controls{position:absolute;top:98px;left:8px;right:8px;display:flex;align-items:center;gap:5px;pointer-events:auto;z-index:3;background:#031326dd;padding:5px;border-radius:6px}#controls select,#controls button{position:static!important;bottom:auto!important;padding:5px!important;font-size:12px!important;min-width:0}#controls select{flex:1;background:#06395a;color:#fff;border:1px solid #50dfff;border-radius:5px}#controlStatus{font-size:10px;position:absolute;top:138px;left:8px;right:8px;color:#8feeff;text-shadow:0 1px #000;pointer-events:none}small{opacity:.8}
</style></head><body><main id="app"><canvas id="scene" width="360" height="640"></canvas><div id="hud" class="hidden"><div id="stats"></div><div id="controls"><select id="controlMode" aria-label="控制模式"><option value="touch">手指左右滑動</option><option value="tilt">手機左右傾斜</option><option value="yaw">手機水平旋轉</option></select><button id="calibrate">校準</button></div><div id="controlStatus">控制：手指左右滑動</div><button id="heal">補血 +25</button><div id="skills" style="position:absolute;bottom:62px;left:8px;right:8px;display:flex;gap:4px;pointer-events:auto"><button data-skill="bullet">彈 Lv0</button><button data-skill="beam">光 Lv0</button><button data-skill="defense">盾 Lv0</button><button data-skill="clone">分 Lv0</button></div><div id="upgradeHint"></div><button id="pause">暫停</button><button id="sound">音效：開</button></div><div id="overlay" class="overlay"><img id="splash" src="assets/images/intro.png" alt="CELL DEFENDER"><h1 id="heading">CELL DEFENDER</h1><div id="message">細胞防衛戰</div><button id="primary">進入主選單</button><button id="secondary" class="hidden">返回主選單</button><small>手指滑動／傾斜／水平旋轉・自動射擊</small></div></main><script src="game.js"></script><script src="controls.js"></script><script>
const g=new CellGame.Game(),cv=document.getElementById('scene'),ctx=cv.getContext('2d'),overlay=document.getElementById('overlay'),hud=document.getElementById('hud'),splash=document.getElementById('splash'),heading=document.getElementById('heading'),message=document.getElementById('message'),primary=document.getElementById('primary'),secondary=document.getElementById('secondary'),stats=document.getElementById('stats');let last=performance.now();const audio={};for(const key of Object.values(CellGame.SOUNDS)){audio[key]=new Audio('assets/audio/'+key+'.wav');audio[key].preload='auto';}
const soundPool={};const soundLast={};function playSounds(){const now=performance.now();for(const name of g.drain()){const original=audio[name];if(!original)continue;const gap=name==='shoot'?65:name==='bullet'?90:35;if(now-(soundLast[name]??-Infinity)<gap)continue;soundLast[name]=now;const pool=soundPool[name]??(soundPool[name]=Array.from({length:name==='shoot'?4:3},()=>original.cloneNode()));const a=pool.find(x=>x.paused||x.ended);if(!a)continue;a.volume=name==='shoot'?.24:.55;a.currentTime=0;a.play().catch(()=>{});}}
function ui(){const playing=g.state==='playing';hud.classList.toggle('hidden',!playing);overlay.classList.toggle('hidden',playing);secondary.classList.toggle('hidden',!['over','clear','paused'].includes(g.state));if(playing)return;
 if(g.state==='paused'){heading.textContent='暫停';splash.src='assets/images/main_menu.png';message.textContent='遊戲已暫停';primary.textContent='繼續遊戲';return;}
 const states={paused:['暫停','遊戲已暫停','繼續遊戲','main_menu.png'],intro:['CELL DEFENDER','細胞防衛戰','進入主選單','intro.png'],menu:['主選單','守護細胞，擊退感染','開始遊戲','main_menu.png'],over:['任務失敗','分數：'+g.score,'重新挑戰','game_over.png'],clear:['任務完成','分數：'+g.score+'／經驗：'+g.xp,'進入無盡模式','mission_clear.png']};const a=states[g.state];if(a){heading.textContent=a[0];message.textContent=a[1];primary.textContent=a[2];splash.src='assets/images/'+a[3];}}
function syncSkillLabels(){document.getElementById('upgradeHint').textContent=g.pendingUpgrades?'升級選擇 × '+g.pendingUpgrades:'';document.querySelectorAll('[data-skill]').forEach(b=>{const name=b.dataset.skill;b.textContent=({bullet:'彈',beam:'光',defense:'盾',clone:'分'}[name])+' Lv'+g.skills[name];});}primary.onclick=()=>{if(g.state==='paused'){g.pause();}else if(g.state==='intro'){g.menu();}else if(g.state==='clear'){g.startEndless();}else{g.start();syncSkillLabels();}ui();playSounds();};secondary.onclick=()=>{g.menu();ui();};document.getElementById('heal').onclick=()=>{g.heal();playSounds();};document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{const name=b.dataset.skill;if(g.upgrade(name)){syncSkillLabels();playSounds();}});document.getElementById('pause').onclick=()=>{g.pause();ui();};document.getElementById('sound').onclick=()=>{g.soundEnabled=!g.soundEnabled;document.getElementById('sound').textContent='音效：'+(g.soundEnabled?'開':'關');};
const controller=new CellControls.Controller();const modeSelect=document.getElementById('controlMode'),status=document.getElementById('controlStatus');
const setStatus=s=>{status.textContent=s;};
async function chooseMode(mode){controller.setMode(mode);if(mode==='touch'){setStatus('控制：手指左右滑動');return;}try{if(window.cellNativeSensorAvailable===false)throw Error('裝置沒有可用的方向感測器');if(window.cellNativeSensorAvailable!==true&&typeof DeviceOrientationEvent==='undefined')throw Error('裝置不支援方向感測器');if(window.cellNativeSensorAvailable!==true&&typeof DeviceOrientationEvent.requestPermission==='function'){const granted=await DeviceOrientationEvent.requestPermission();if(granted!=='granted')throw Error('感測器權限未授予');}setStatus('請將手機置於舒適位置，點擊校準');}catch(e){controller.setMode('touch');modeSelect.value='touch';setStatus(e.message+'，已改用手指控制');}}
modeSelect.addEventListener('change',()=>chooseMode(modeSelect.value));
document.getElementById('calibrate').addEventListener('click',()=>{if(controller.calibrate())setStatus('校準完成');else setStatus('尚未收到有效方向感測資料');});
window.addEventListener('deviceorientation',e=>{controller.orientation(e.gamma,e.alpha);},{passive:true});
window.cellNativeOrientation=(gamma,alpha)=>controller.orientation(gamma,alpha);
function point(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*360/r.width,y:(e.clientY-r.top)*640/r.height};}
cv.addEventListener('pointerdown',e=>{if(controller.mode!=='touch'||g.state!=='playing')return;cv.setPointerCapture(e.pointerId);controller.beginTouch(e.pointerId,point(e).x,g.player.x);});
cv.addEventListener('pointermove',e=>{if(controller.mode!=='touch'||g.state!=='playing')return;const x=controller.drag(e.pointerId,point(e).x);if(x!==null)g.move(x,g.player.y);});
for(const event of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(event,e=>controller.endTouch(e.pointerId));

function render(){ctx.clearRect(0,0,360,640);ctx.fillStyle='#061326';ctx.fillRect(0,0,360,640);for(let i=0;i<26;i++){const x=(i*97+Math.sin(g.time+i)*12)%360,y=(i*139+g.time*12)%640;ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fillStyle='#12436d';ctx.fill();}if(g.state==='playing'){ctx.fillStyle='#2eeaff';ctx.beginPath();ctx.moveTo(g.player.x,g.player.y-20);ctx.lineTo(g.player.x-13,g.player.y+13);ctx.lineTo(g.player.x+13,g.player.y+13);ctx.closePath();ctx.fill();if(g.shield>0){ctx.save();ctx.shadowColor='#3af6ff';ctx.shadowBlur=17;ctx.strokeStyle='#55f4ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(g.player.x,g.player.y,27+Math.sin(g.time*5)*1.5,0,Math.PI*2);ctx.stroke();ctx.restore();}if(g.beamVisualTime>0){ctx.save();ctx.shadowColor='#ff43e9';ctx.shadowBlur=24;ctx.fillStyle='#ff4ff0';ctx.fillRect(g.player.x-5,0,10,g.player.y-18);ctx.fillStyle='#fff3ff';ctx.fillRect(g.player.x-1.5,0,3,g.player.y-18);ctx.restore();}for(const b of g.bullets){ctx.fillStyle=b.clone?'#81ffde':'#ffe35d';ctx.fillRect(b.x-2,b.y-11,4,15);}for(const shot of g.enemyShots){ctx.fillStyle='#ff614d';ctx.beginPath();ctx.arc(shot.x,shot.y,4,0,Math.PI*2);ctx.fill();}if(g.skills.clone){const count=Math.min(3,Math.ceil(g.skills.clone/2));for(let i=0;i<count;i++){const x=Math.max(16,Math.min(344,g.player.x+(i-(count-1)/2)*40+(count===1?34:0))),y=g.player.y+25+Math.sin(g.time*4+i)*3;ctx.fillStyle='#73fce4';ctx.beginPath();ctx.moveTo(x,y-13);ctx.lineTo(x-10,y+8);ctx.lineTo(x,y+4);ctx.lineTo(x+10,y+8);ctx.closePath();ctx.fill();}}for(const e of g.enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=({strafe:'#f75d86',armored:'#7f9bce',aggressive:'#ff6047',escape:'#e4c35b',stationary:'#9c83ee',mother:'#72d88c',boss:'#ff3278'})[e.type]||'#d93c73';ctx.beginPath();if(e.type==='armored')ctx.rect(-e.r,-e.r,e.r*2,e.r*2);else if(e.type==='aggressive'){ctx.moveTo(0,e.r);ctx.lineTo(-e.r,-e.r);ctx.lineTo(e.r,-e.r);}else if(e.type==='escape'){ctx.moveTo(0,-e.r);ctx.lineTo(e.r,0);ctx.lineTo(0,e.r);ctx.lineTo(-e.r,0);}else ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f4f8ff';ctx.stroke();ctx.restore();}syncSkillLabels();stats.textContent='生命 '+g.hp+'/100　護盾 '+g.shield+'/9　等級 '+g.level+'　經驗 '+g.xp+'/'+g.nextLevelXp+'　分數 '+g.score+'　'+'第'+g.stage+'關 '+CellGame.STAGES[Math.min(5,g.stage-1)]+' '+Math.max(0,420-Math.floor(g.stageTime))+'秒';}}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;{if(g.state==='playing'&&controller.mode!=='touch'){const x=controller.step(g.player.x,dt);g.move(x,g.player.y);}g.tick(dt);playSounds();}render();if(['clear','over'].includes(g.state)&&overlay.classList.contains('hidden'))ui();requestAnimationFrame(frame);}ui();requestAnimationFrame(frame);
</script></body></html>
